plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Pack mods ship SRG-named mixin refmaps; remap them to dev names so their mixins apply in runClient/runServer.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // CurseMaven serves any CurseForge file as curse.maven:<name>-<projectId>:<fileId>.
    // Not exclusiveContent: ForgeGradle stores the deobfuscated copies in its own local repo under the same group.
    maven {
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

// Resolves a "<projectId>:<fileId>" property from gradle.properties into a CurseMaven coordinate.
def cf(String name) {
    def (projectId, fileId) = project.property("${name}_cf").toString().tokenize(':')
    return "curse.maven:${name}-${projectId}:${fileId}"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Mods the binder integrates with: compiled against and present in runClient/runServer.
    implementation fg.deobf(cf('epicfight'))
    implementation fg.deobf(cf('irons_spellbooks'))
    implementation fg.deobf(cf('cataclysm'))
    implementation fg.deobf(cf('puffish_skills'))
    implementation fg.deobf(cf('cursedfate'))
    compileOnly fg.deobf(cf('jei'))
    // Epic Fight Ponder ships in the pack's overrides (not on CurseForge); Ponder is bundled inside it.
    compileOnly files('libs/epic_fight_ponder-1.0.0.jar', 'libs/Ponder-Forge-1.20.1-1.0.91.jar')
    // Iron's Spell Scroll Ponder: its spell preview is opened from the abilities screen and skill tree.
    compileOnly files('libs/iss_ponder-forge1.20.1-1.0.3-all.jar')
    // Sword Soaring: the Vatansever's flight and the mod's flight keys are switched off (mixin/swordsoaring).
    compileOnly files('libs/sword_soaring-20.14.2.8-mc1.20.1-forge.jar')
    // Projection Sorcery (Cursed Fate addon) and Epic Fight Nightfall: abilities cast from the wheel (ability/).
    compileOnly files('libs/BaldasProjectionSorcery-2.0.1.2.jar', 'libs/EpicFightNightfall-3.4.2-all.jar')
    // Distant Horizons and Chunky (only the classes the binder touches): DH binds to Chunky only once it is loaded (mixin/distanthorizons).
    compileOnly files('libs/DistantHorizons-3.3.3-chunky-classes.jar', 'libs/Chunky-1.3.146-provider-classes.jar')
    // Weapons of Miracles, Villager Recruits / Village Recruits, Cursed Fate Meimei and Calio (inside Origins): compat (compat/, mixin/).
    compileOnly files('libs/WeaponsOfMiracles-2.0.171-mc1.20.1-forge.jar', 'libs/recruits-1.20.1-1.15.2.jar',
            'libs/village_recruits-1.0.7.93TC-205.jar', 'libs/cursedfate_meimei-1.1.2-forge-1.20.1.jar',
            'libs/calio-forge-1.20.1-1.11.0.5.jar', 'libs/antimagic-1.0.0.jar')
    // Fen's RPG Titles: every player's title is their class (skills/ClassTitles, mixin/fen).
    compileOnly files('libs/mmorpgtitles-2.3.3-forge1.20.1.jar')
    // Apoli (inside Origins): the pack's own races and classes check their marker powers (content/OriginTraits).
    compileOnly files('libs/apoli-forge-1.20.1-2.9.0.8.jar')
    // Origins: the status page shows the player's race, Martial class and job (client/CharacterScreen).
    compileOnly files('libs/origins-forge-1.20.1-1.10.0.9-all.jar')
    // Bountiful: BountyLean leans new board bounties toward nearby players' Job and Martial decrees
    compileOnly files('libs/Bountiful-6.0.4+1.20.1-forge.jar', 'libs/Kambrik-6.1.1+1.20.1-forge.jar')
    // Stamina Interactions Reworked: StaminaMonitorMixin softens the out-of-stamina effects
    compileOnly files('libs/stamina_interactions_reworked-2.3.jar')
    // Parties: PartiesBufferMixin fixes its ghost rendering crash on enchanted items
    compileOnly files('libs/Parties-1.20.1-2.2.0.jar')
    // Xaero's Minimap: compat/PartyMapTracker shows party members on the minimap and world map
    compileOnly files('libs/Xaeros_Minimap_FP24.2.0_Forge_1.20.jar')
    // Alshanex's Familiars: ShadowEntityMixin and ShadowSummonSpellMixin rework Call the Shadows
    compileOnly files('libs/alshanex_familiars-1.20.1_v4.1.0.jar')
    // Somakespells: SpectralRondoPlayerRenderHandlerMixin keeps Spectral Rondo's pose push and pop paired
    compileOnly files('libs/somakespells-1.0.9-1.20.1-fixaltar.jar')
    // Interlace Spellweaves: mixin/csw silences its first-cast chat line
    compileOnly files('libs/iss_csw-0.3.7.jar')
    // Pehkui: the Summon Oni's size (modified/SummonSpells)
    compileOnly files('libs/Pehkui-3.8.2+1.20.1-forge.jar')
    // Magic from the East: Kunai Rain throws its splitting shuriken (modified/MartialSpells)
    compileOnly files('libs/iss_magicfromtheeast-1.20.1-1.1.3.jar')
    // Curios: client/DqInventoryScreen draws its inventory menu (the pack's jar; the CurseMaven copy is runtime only)
    compileOnly files('libs/curios-forge-5.14.1+1.20.1.jar')
    // Inventory Profiles Next: client/DqInventoryScreen's @IPNGuiHints move its sort buttons onto the screen's windows
    compileOnly files('libs/InventoryProfilesNext-forge-1.20-1.10.20.jar')
    // GeckoLib: mixin/geckolib/ bends GeckoLib armour at the elbows and knees under Epic Fight (the pack's jar)
    compileOnly files('libs/geckolib-forge-1.20.1-4.8.4.jar')
    // Backpacked and Framework: compat/backpacked/ adds the pack's own backpack augments (the pack's jars)
    compileOnly files('libs/backpacked-forge-1.20.1-3.0.9.jar', 'libs/framework-forge-1.20.1-0.8.0.jar')
    // FTB Quests (with FTB Library, FTB Teams and Architectury): compat/ftbquests/ActiveQuest lets a player take one quest at a time
    compileOnly files('libs/ftb-quests-forge-2001.4.22.jar', 'libs/ftb-library-forge-2001.2.13.jar', 'libs/ftb-teams-forge-2001.3.2.jar', 'libs/architectury-9.2.14-forge.jar')
    // Sodium Dynamic Lights: client/LanternBeltLight lights up a lantern worn on the belt (the pack's jar)
    compileOnly files('libs/sodiumdynamiclights-forge-1.0.10-1.20.1.jar')
    // Pick Up Notifier: mixin/pickupnotifier/ starts its entries above the ability bar (the pack's jar)
    compileOnly files('libs/PickUpNotifier-v8.0.0-1.20.1-Forge.jar')
    // Just Enough Resources: compat/jer/ and mixin/jer/ fill its mob and chest pages from the server's loot (the pack's jar)
    compileOnly files('libs/JustEnoughResources-1.20.1-1.4.0.247.jar')
    // Vanilla Backport: the Storm Hounds (modified/SummonSpells) are its snowy wolf variant (the pack's jar)
    compileOnly files('libs/VanillaBackport-forge-1.20.1-1.1.7.10.jar', 'libs/Platform-forge-1.20.1-1.3.4.jar')

    // Their required dependencies, only needed at runtime in the dev environment.
    runtimeOnly fg.deobf(cf('irons_lib'))
    runtimeOnly fg.deobf(cf('curios'))
    runtimeOnly fg.deobf(cf('geckolib'))
    runtimeOnly fg.deobf(cf('playeranimator'))
    runtimeOnly fg.deobf(cf('lionfishapi'))
    runtimeOnly fg.deobf(cf('photon'))
    runtimeOnly fg.deobf(cf('ldlib'))
    runtimeOnly fg.deobf(cf('kleiders'))
    runtimeOnly fg.deobf(cf('puffish_attributes'))
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
